# =============================================================================
# Terminal AI streams, server-sent events (APP-OWNED)
# =============================================================================
# The terminal AI assistant (#55, #56) answers over a text/event-stream under
# /api/ai/terminal/. The platform's nginx.conf already carries the generic AI
# response stream (`/api/ai/responses/stream`) and the telemetry assistant
# stream, but not this prefix, so without this file the answer would be
# buffered and cut at the 60 s `/api` read timeout.
#
# platform/sse-proxy.conf: unbuffered, 600 s timeouts, the security headers.
# Plain JSON routes under the same prefix (consent, settings) pass through it
# unharmed. A longer prefix wins over the plain `location /api`.
#
# ON A VPS THIS IS ONLY HALF THE WORK: add the same path to the CLI's
# `proxy.streamPaths` (#72) so the shared host proxy does not buffer it.
# =============================================================================

location /api/ai/terminal/ {
    include /etc/nginx/platform/sse-proxy.conf;
}
