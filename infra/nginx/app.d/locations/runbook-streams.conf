# =============================================================================
# Runbook log streams, server-sent events (APP-OWNED)
# =============================================================================
# A runbook run writes its log to the browser as it is produced:
#
#   GET /api/runbook-runs/:runId/logs/stream
#   GET /api/runbook-runs/:runId/targets/:targetId/logs/stream
#
# Through the generic `/api` location they would be buffered and cut at 60 s.
# platform/sse-proxy.conf is the unbuffered proxy with 600 s timeouts and the
# security headers. A regex location wins over the plain `location /api`.
#
# TODO(#62): the runbook log stream is not merged yet. Confirm the final path
# against the controller when #62 lands and adjust the pattern if it differs.
#
# ON A VPS THIS IS ONLY HALF THE WORK. The shared host proxy in front of the
# stack buffers and cuts anything else at 60 s, so declare the same path to the
# CLI too (`proxy.streamPaths` in the CLI's createCli options, #72).
# =============================================================================

location ~ ^/api/runbook-runs/[^/]+/(targets/[^/]+/)?logs/stream$ {
    include /etc/nginx/platform/sse-proxy.conf;
}
