# =============================================================================
# The terminal's "upload file" route (APP-OWNED)
# =============================================================================
# The terminal toolbar uploads a file with a multipart
# `POST /api/storage/objects` (the storage slice's simple upload). nginx
# refuses a request body above `client_max_body_size` (1 MiB when unset, and
# the platform's nginx.conf sets it for no `/api` route) with a 413 that never
# reaches the API, so a file of a few MiB would fail at the proxy.
#
# 100 MiB matches the default ceiling of the edge proxy of a VPS deployment
# (`MAX_FILE_SIZE` widens it there); the storage slice enforces the real limit
# itself while it reads the stream, and larger files use the resumable upload
# routes, which send small parts. `proxy_request_buffering off` hands the body
# to the API as it arrives instead of spooling a copy to disk first.
#
# Exact match: only the simple upload. Everything else repeats the generic
# `/api` location.
# =============================================================================

location = /api/storage/objects {
    client_max_body_size 100m;
    proxy_request_buffering off;

    proxy_pass http://api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    include /etc/nginx/platform/security-headers.conf;
}
