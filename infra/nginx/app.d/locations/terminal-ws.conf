# =============================================================================
# The terminal WebSocket (APP-OWNED)
# =============================================================================
# GET /api/terminal/ws upgrades to a WebSocket that carries one terminal's
# input and output for as long as the browser tab stays open. The platform's
# generic `location /api` forwards the Upgrade headers too, but with a 60 s
# `proxy_read_timeout`, and nginx closes a proxied connection that carries no
# data from the API for that long (the browser sees code 1006). The gateway
# sends a WebSocket ping every 30 s, which today keeps even that timer alive,
# but an idle terminal must not depend on that interval staying under 60 s.
#
# This exact-match location (it wins over every prefix and regex location) is
# the same proxy, with:
#
#   proxy_read_timeout 3600s / proxy_send_timeout 3600s
#     An idle terminal is normal. One hour bounds a forgotten tab without
#     cutting a working session.
#
#   proxy_buffering off
#     Keystrokes and output are tiny frames that must not wait in a buffer.
#
#   include platform/security-headers.conf
#     nginx's add_header replaces, it does not merge, so a location that sets
#     any header of its own drops the server-level CSP and HSTS. This one adds
#     none, and still includes the snippet so a later header cannot silently
#     drop them (nginx-app-locations.spec.ts enforces the rule).
#
# `Connection "upgrade"` is unconditional on purpose: this route only serves
# WebSocket clients. The browser side needs no CSP entry: the socket is
# same-origin and connect-src 'self' covers it (tests/e2e verifies this).
# =============================================================================

location = /api/terminal/ws {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    proxy_buffering off;

    include /etc/nginx/platform/security-headers.conf;
}
