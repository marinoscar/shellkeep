name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Check module classification
        run: node scripts/platform-adoption/check-classification.mjs
      - name: Check shim markers against the local-exceptions ledger
        run: npm run check:shims
      - run: npm run prisma:generate --workspace=api
      - name: Composed schema is current (prisma/schema/ equals a fresh compose)
        run: npm run db:compose:check --workspace=api
      - name: Installed migrations equal the package (platform.lock)
        run: npm run db:check --workspace=api
      - name: "Permission snapshot is current: permissions:dump --check (web conformance reads it)"
        run: npm run permissions:dump --workspace=api -- --check
      - run: npm run typecheck --workspace=api
      - run: npm run typecheck --workspace=web
      - run: npm run typecheck --workspace=cli
      - run: npm run lint --workspace=api --if-present
      - run: npm run lint --workspace=web --if-present
      - name: Platform pin (one exact version everywhere)
        run: npm run check:platform-pin
      - name: Platform pin check self-test
        run: npm run test:scripts
      - name: Single instance of shared dependencies
        run: npm run check:single-instance
      - name: No deep imports into platform packages
        run: npm run check:platform-imports
      - name: "Infra is generated: platform-infra sync --check"
        run: npm run platform:infra:sync -- --check
      - name: "Infra conformance: compose config per mode and nginx -t (runs in the CLI workspace)"
        run: npm run test:infra

  docker:
    name: Docker (images, generated stack, nginx -t)
    runs-on: ubuntu-24.04
    needs: [check]
    timeout-minutes: 20
    env:
      COMPOSE_FILES: -f base.compose.yml -f prod.compose.yml -f devdb.compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image (as deploy.yml does)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build the web image (as deploy.yml does)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          target: production
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Write a throwaway .env (every secret generated, nothing literal)
        working-directory: infra/compose
        run: |
          cp .env.example .env
          {
            echo "NGINX_PORT=8323"
            echo "APP_URL=http://localhost:8323"
            echo "GOOGLE_CALLBACK_URL=http://localhost:8323/api/auth/google/callback"
            echo "POSTGRES_HOST=db"
            echo "POSTGRES_USER=app"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=appdb"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "COOKIE_SECRET=$(openssl rand -hex 32)"
            echo "SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "INITIAL_ADMIN_EMAIL=ci-admin@example.test"
          } >> .env
      - name: Create the shared network and build the stack images
        working-directory: infra/compose
        run: |
          docker network create devnet
          docker compose $COMPOSE_FILES build
      - name: Start the database and migrate and seed as the application role
        working-directory: infra/compose
        run: |
          docker compose $COMPOSE_FILES up -d --wait db
          docker compose $COMPOSE_FILES run --rm -T api npm run prisma:migrate
          docker compose $COMPOSE_FILES run --rm -T api npm run prisma:seed
      - name: Start the stack
        working-directory: infra/compose
        run: docker compose $COMPOSE_FILES up -d
      - name: "Smoke: /api/health/ready and / answer 200 on port 8323"
        run: |
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8323/api/health/ready || true)"
            [ "$code" = "200" ] && break
            sleep 3
          done
          echo "ready: $code"
          [ "$code" = "200" ]
          curl -fsS -D - -o /tmp/index.html http://localhost:8323/ | head -20
          grep -qi '<html' /tmp/index.html
      - name: nginx -t inside the nginx container
        working-directory: infra/compose
        run: docker compose $COMPOSE_FILES exec -T nginx nginx -t
      - name: Show logs on failure
        if: failure()
        working-directory: infra/compose
        run: docker compose $COMPOSE_FILES logs --tail 200
      - name: Tear the stack down
        if: always()
        working-directory: infra/compose
        run: docker compose $COMPOSE_FILES down -v

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=api
      - name: API tests
        run: npm test --workspace=api
        env:
          NODE_ENV: test
      - name: Web tests
        run: npm run test:run --workspace=web
        env:
          NODE_ENV: test
      - name: "CLI tests (includes the platform conformance suites cli, deployRegistrations and tui)"
        run: npm run test:run --workspace=cli
        env:
          NODE_ENV: test

  database:
    name: Database (fresh migrate, seed, drift, db tests)
    runs-on: ubuntu-24.04
    needs: [check]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: shellkeep
          # Throwaway CI container: trust auth, so no credential lives in this file.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The Prisma and platform CLIs build DATABASE_URL from these
      # (apps/api/scripts/prisma-env.js).
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_DB: shellkeep
      POSTGRES_SSL: 'false'
      INITIAL_ADMIN_EMAIL: ci-admin@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=api
      - name: Migrate an empty database
        run: npm run prisma:migrate --workspace=api
      - name: Seed
        run: npm run prisma:seed --workspace=api
      - name: Ledger agrees with the files
        run: npm run db:check:database --workspace=api
      - name: Migrations equal the composed schema
        run: npm run db:drift --workspace=api
      - name: Create the application role (idempotent ownership transfer)
        run: |
          APP_PW="$(openssl rand -hex 24)"
          echo "::add-mask::$APP_PW"
          echo "APP_ROLE_PASSWORD=$APP_PW" >> "$GITHUB_ENV"
          psql -v ON_ERROR_STOP=1 -v app=shellkeep_app -v app_password="$APP_PW" -f prisma/sql/create-app-role.sql
        working-directory: apps/api
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: shellkeep
      # Two tiers run the same suites (#52). The first connects as the bootstrap
      # superuser, which ignores row-level security; the second as the ordinary
      # application role, under which the forced policies apply. Suites that must
      # create roles or databases or replay the whole migration history reach the
      # cluster through TEST_DB_ADMIN_USER, never through POSTGRES_USER.
      - name: Real-database tests (bootstrap superuser)
        run: npm run test:db --workspace=api
        env:
          NODE_ENV: test
      - name: Real-database tests (application role shellkeep_app)
        run: npm run test:db --workspace=api
        env:
          NODE_ENV: test
          POSTGRES_USER: shellkeep_app
          POSTGRES_PASSWORD: ${{ env.APP_ROLE_PASSWORD }}
          TEST_DB_ADMIN_USER: postgres

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    # Reads decorator metadata only and shares nothing with the build job, so it
    # needs no database and runs concurrently.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The dump imports AppModule, which imports @prisma/client; preview mode never
      # instantiates PrismaService, but the generated client has to exist.
      - run: npm run prisma:generate --workspace=api
      - run: npm run openapi:typecheck --workspace=api
      - name: "Dump the OpenAPI document (Nest preview mode: no database, no credentials)"
        run: npm run openapi:dump
      - name: Lint the document (Spectral)
        run: npm run openapi:lint

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    # No `needs:` and no database, API or SSH server: it screenshots the harness
    # in apps/web/visual (the real routes behind a fake auth context, a fake
    # terminal WebSocket and JSON fixtures), so it runs alongside everything else.
    #
    # A pixel baseline depends on the exact browser BUILD, not just the
    # Playwright API version, so this job runs in the image the baselines under
    # tests/visual/__screenshots__ were generated in.
    #
    # THE PLAYWRIGHT VERSION LIVES IN THREE PLACES THAT CHANGE TOGETHER: this
    # tag, the tag in visual-baselines.yml and the exact (caret-free)
    # `@playwright/test` pin in tests/visual/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    # The one job that may write: only the failure path below pushes a throwaway
    # branch (never the PR branch, never main).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The root install provides apps/web and the Vite the harness builds with.
      # tests/visual is not an npm workspace (a test-runner package, like
      # tests/e2e), so its pinned @playwright/test is a separate install.
      - run: npm ci
      - run: npm ci
        working-directory: tests/visual
      - name: Typecheck the specs and the support code
        run: npm run typecheck
        working-directory: tests/visual
      # The binary directly, NOT `npx playwright`: npx walks up from the repo
      # root, finds no local install and fetches whatever is latest, which loads
      # a second @playwright/test module than the one the specs import
      # ("Playwright Test did not expect test() to be called here").
      #
      # playwright.config.ts builds the harness and serves it itself (webServer).
      # A pixel diff, or a missing baseline, fails the job; no retries.
      - run: tests/visual/node_modules/.bin/playwright test --config=tests/visual/playwright.config.ts
      # Everything below runs ONLY when the comparison above failed, and none of
      # it can turn the job green: the job has already failed.
      #
      # The report first, before the regeneration below rewrites it: it embeds
      # the expected, actual and diff image of every failed assertion.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: tests/visual/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      # Regenerate every baseline in this same pinned image and offer them as an
      # artifact, so a reviewer can take them from a failed run. They are never
      # committed or applied by CI (a red `visual` job must not heal itself);
      # a person reviews the images and commits them. Same command as the
      # manual visual-baselines.yml workflow.
      - name: Regenerate the baselines (artifact only, the job stays failed)
        if: failure()
        run: tests/visual/node_modules/.bin/playwright test --config=tests/visual/playwright.config.ts --update-snapshots
      # The artifact root is the contents of tests/visual/__screenshots__/: unzip
      # it into that directory.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14
      # The same images as a branch a reviewer can `git fetch` where artifact
      # downloads are blocked. ONLY for a pull request from this repository (a
      # fork never gets a write), ONLY tests/visual/__screenshots__/, and ONLY to
      # a new throwaway branch cut from the PR head: never the PR branch, never
      # main. The job stays failed; a person reviews the images and commits them
      # to the PR branch.
      - name: "Push the regenerated baselines to ci/visual-baselines/<pr>-<run>"
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          BRANCH: ci/visual-baselines/${{ github.event.pull_request.number }}-${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -z "$(ls -A tests/visual/__screenshots__ 2>/dev/null)" ]; then
            echo 'No regenerated baselines to push.'
            exit 0
          fi
          # The checkout is the PR's merge commit; the branch starts at the PR
          # head, and the working tree (with the new images) is kept as it is.
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git checkout -q -b "$BRANCH"
          git reset -q "$HEAD_SHA"
          git add -A -- tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo 'The PR head already has these baselines; nothing to push.'
            exit 0
          fi
          git commit -q -m 'chore(tests): regenerated visual baselines (for review, not for merging as is)'
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "Pushed ${BRANCH}"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=api
      - run: npm run build --workspace=api
      - run: npm run build --workspace=web
      - run: npm run build --workspace=cli
      - name: "CLI smoke: --version and --help"
        run: |
          node apps/cli/dist/cli.js --version
          node apps/cli/dist/cli.js --help
