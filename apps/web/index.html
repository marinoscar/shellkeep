<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-visual (#170): the on-screen keyboard shrinks the visual
         viewport only, so useKeyboardInset can measure it. Chrome 108+ default, pinned for the
         Android TWA's older engines; resizes-content would make the inset 0 (terminal.md 5.12). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual" />
    <meta name="description" content="Browser-based terminal workspace with persistent sessions" />
    <meta name="theme-color" content="%SHELLKEEP_THEME_COLOR%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShellKeep" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>ShellKeep</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
